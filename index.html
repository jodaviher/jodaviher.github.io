<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Actividad - Festival Vallenato</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: var(--tg-theme-bg-color, #f4f4f9); 
            color: var(--tg-theme-text-color, #333); 
            margin: 0; 
            padding: 15px; 
        }
        .container { 
            background: var(--tg-theme-secondary-bg-color, #ffffff); 
            border-radius: 10px; 
            padding: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            max-width: 400px; 
            margin: 0 auto; 
        }
        h2 { 
            text-align: center; 
            color: #d32f2f; /* Rojo acorde a la marca Águila/Festival */
            margin-top: 0; 
        }
        label { 
            font-weight: bold; 
            display: block; 
            margin-top: 15px; 
            margin-bottom: 5px; 
            font-size: 14px; 
        }
        select, input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 15px; 
            background-color: var(--tg-theme-bg-color, #fff); 
            color: var(--tg-theme-text-color, #000); 
        }
        select:disabled, input:disabled { 
            background-color: #e9ecef; 
            color: #6c757d; 
        }
        .btn { 
            background-color: #d32f2f; 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 5px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 25px; 
            transition: background-color 0.3s;
        }
        .btn:active {
            background-color: #b71c1c;
        }
        .hidden { display: none; }
        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            display: block;
        }
        .badge {
            display: inline-block;
            background-color: #fff3cd;
            color: #856404;
            padding: 8px;
            border-radius: 5px;
            font-size: 13px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
            border-left: 4px solid #ffeeba;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Actividad - Festival Vallenato</h2>

    <label for="acordeonero">👤 1. Acordeonero (Candidato)</label>
    <select id="acordeonero" required>
        <option value="">Cargando candidatos...</option>
    </select>

    <label for="negocio">🏪 2. Negocio (Local)</label>
    <select id="negocio" disabled required>
        <option value="">Primero seleccione un acordeonero</option>
    </select>

    <label for="etapa">📦 3. Etapa a registrar</label>
    <select id="etapa" disabled required>
        <option value="">Seleccione la etapa...</option>
        <option value="SELLADO">🔒 1. Urna Sellada (Recepción)</option>
        <option value="DEPURACION">🧹 2. Depuración (Material separado)</option>
        <option value="PESAJE">⚖️ 3. Pesaje (Tapas válidas)</option>
    </select>

    <!-- Paso 4: Pesaje (Condicional) -->
    <div id="bloque-pesaje" class="hidden">
        <label>⚖️ Tipo de medida:</label>
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <label style="margin-top: 0; font-weight: normal;">
                <input type="radio" name="tipo_medida" value="Kg" checked> Kilogramos
            </label>
            <label style="margin-top: 0; font-weight: normal;">
                <input type="radio" name="tipo_medida" value="Unidades"> Unidades
            </label>
        </div>
        
        <label for="valor">🔢 Ingrese el valor :</label>
        <input type="number" id="valor" placeholder="Ej: 4.5 para Kilogramos o 12 para Unidades" step="any" min="0">
        
        <div class="badge">
            ℹ️ <b>Nota:</b> Si pesa en Kg, el total se calculará automático. Si elige Unidades, se guardará el número exacto.
        </div>
    </div>

    <button type="button" class="btn hidden" id="btn-enviar">📸 Continuar para enviar Foto</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let dbBodega = [];

    // Referencias al DOM
    const selectAcordeonero = document.getElementById('acordeonero');
    const selectNegocio = document.getElementById('negocio');
    const selectEtapa = document.getElementById('etapa');
    const bloquePesaje = document.getElementById('bloque-pesaje');
    const inputValor = document.getElementById('valor');
    const btnEnviar = document.getElementById('btn-enviar');

    // 1. Cargar el JSON al iniciar
    async function cargarDatos() {
        try {
            // Asegúrate de que el archivo JSON se llame 'data_valledupar.json' en tu GitHub
            const response = await fetch('data_valledupar.json');
            dbBodega = await response.json();
            
            selectAcordeonero.innerHTML = '<option value="">Seleccione el acordeonero...</option>';
            dbBodega.forEach(dato => {
                let option = document.createElement('option');
                option.value = dato.acordeonero;
                option.text = dato.acordeonero;
                selectAcordeonero.appendChild(option);
            });
        } catch (error) {
            tg.showAlert("Error cargando la base de datos. Verifique su conexión.");
        }
    }

    cargarDatos();

    // 2. Lógica en cascada: Al cambiar Acordeonero, llenar Negocios
    selectAcordeonero.addEventListener('change', () => {
        const acordeoneroElegido = selectAcordeonero.value;
        selectNegocio.innerHTML = '<option value="">Seleccione el negocio...</option>';
        
        if (acordeoneroElegido) {
            const dataAcordeonero = dbBodega.find(d => d.acordeonero === acordeoneroElegido);
            dataAcordeonero.locales.forEach(local => {
                let option = document.createElement('option');
                option.value = local;
                option.text = local;
                selectNegocio.appendChild(option);
            });
            selectNegocio.disabled = false;
        } else {
            selectNegocio.disabled = true;
            selectEtapa.disabled = true;
            btnEnviar.classList.add('hidden');
        }
    });

    // 3. Al seleccionar negocio, habilitar etapas
    selectNegocio.addEventListener('change', () => {
        if(selectNegocio.value) {
            selectEtapa.disabled = false;
        } else {
            selectEtapa.disabled = true;
            btnEnviar.classList.add('hidden');
        }
    });

    // 4. Lógica de Etapas: Mostrar Pesaje condicionalmente
    selectEtapa.addEventListener('change', () => {
        const etapa = selectEtapa.value;
        
        if (etapa === "PESAJE") {
            bloquePesaje.classList.remove('hidden');
            inputValor.value = ""; // <-- CORREGIDO: Limpiamos la variable correcta
        } else {
            bloquePesaje.classList.add('hidden');
        }
    
    // Mostrar el botón de enviar si hay una etapa seleccionada

        if (etapa !== "") {
            btnEnviar.classList.remove('hidden');
        } else {
            btnEnviar.classList.add('hidden');
        }
    });

    // 5. Enviar el Payload al Bot
    btnEnviar.addEventListener('click', () => {
        const acordeonero = selectAcordeonero.value;
        const negocio = selectNegocio.value;
        const etapa = selectEtapa.value;
        let valor = 0;
        let tipoMedida = "N/A";

        if (!acordeonero || !negocio || !etapa) {
            tg.showAlert("Por favor complete todos los campos obligatorios.");
            return;
        }

        if (etapa === "PESAJE") {
            valor = document.getElementById('valor').value.trim();
            tipoMedida = document.querySelector('input[name="tipo_medida"]:checked').value;
            
            // CORRECCIÓN: Permitimos el 0, pero bloqueamos valores negativos o vacíos
            if (valor === "" || isNaN(valor) || parseFloat(valor) < 0) {
                tg.showAlert("Por favor ingrese un valor válido (puede ser 0).");
                return;
            }
        }

        const payload = {
            acordeonero: acordeonero,
            negocio: negocio,
            etapa: etapa,
            valor: etapa === "PESAJE" ? parseFloat(valor) : 0,
            tipo_medida: etapa === "PESAJE" ? tipoMedida : "N/A"
        };

        tg.sendData(JSON.stringify(payload));
    });

</script>

</body>
</html>
