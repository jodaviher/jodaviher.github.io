<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Encuesta Cámara de Comercio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

        :root {
            --bg: var(--tg-theme-bg-color, #f0f2f5);
            --card: var(--tg-theme-secondary-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #1a1d23);
            --subtle: #6b7280;
            --border: #e5e7eb;
            --blue: #1d4ed8;
            --blue-light: #eff6ff;
            --green: #15803d;
            --green-light: #f0fdf4;
            --orange: #c2410c;
            --orange-light: #fff7ed;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            min-height: 100vh;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ── HEADER ── */
        .header {
            background: var(--blue);
            border-radius: var(--radius);
            padding: 16px 18px;
            color: white;
        }
        .header h2 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        .header p {
            font-size: 12px;
            opacity: 0.75;
            margin-top: 3px;
        }

        /* ── CARD ── */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--subtle);
            margin-bottom: 12px;
        }

        /* ── FORM ELEMENTS ── */
        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: block;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.15s;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--blue);
        }
        input[readonly] {
            background: var(--border);
            color: var(--subtle);
            cursor: default;
        }

        .field { margin-bottom: 12px; }
        .field:last-child { margin-bottom: 0; }

        /* ── SEARCH ROW ── */
        .search-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .search-row .field { flex: 1; margin-bottom: 0; }

        /* ── BUTTONS ── */
        .btn {
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 14px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            padding: 11px 16px;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); opacity: 0.85; }
        .btn-search { background: #16a34a; color: white; }
        .btn-primary { background: var(--blue); color: white; width: 100%; padding: 13px; font-size: 15px; border-radius: var(--radius); }

        /* ── LOCAL LIST (selector de sucursales) ── */
        .locales-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .local-card {
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            background: var(--bg);
        }
        .local-card:hover { border-color: var(--blue); background: var(--blue-light); }
        .local-card.selected {
            border-color: var(--blue);
            background: var(--blue-light);
        }
        .local-card .local-nombre {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }
        .local-card .local-dir {
            font-size: 12px;
            color: var(--subtle);
            margin-top: 3px;
            font-family: 'DM Mono', monospace;
        }
        .local-card .local-mat {
            font-size: 11px;
            color: var(--blue);
            font-weight: 600;
            margin-top: 4px;
        }

        /* ── BADGE ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .badge-base { background: var(--green-light); color: var(--green); }
        .badge-nuevo { background: var(--blue-light); color: var(--blue); }

        /* ── HIDDEN ── */
        .hidden { display: none !important; }

        /* ── DIVIDER ── */
        .divider {
            height: 1px;
            background: var(--border);
        }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h2>📊 Plataforma de Registro CCB</h2>
        <p>Cámara de Comercio de Barranquilla</p>
    </div>

    <!-- RUTA -->
    <div class="card">
        <div class="card-title">📍 Asignación</div>
        <div class="field">
            <label for="ruta">Ruta Asignada</label>
            <select id="ruta" required>
                <option value="">Seleccione su ruta...</option>
                <option value="Ruta 1">Ruta 1</option>
                <option value="Ruta 2">Ruta 2</option>
                <option value="Ruta 3">Ruta 3</option>
                <option value="Ruta 4">Ruta 4</option>
                <option value="Ruta 5">Ruta 5</option>
                <option value="Ruta 6">Ruta 6</option>
                <option value="Ruta 7">Ruta 7</option>
                <option value="Ruta 8">Ruta 8</option>
            </select>
        </div>
    </div>

    <!-- BÚSQUEDA POR NIT -->
    <div class="card">
        <div class="card-title">🔍 Búsqueda</div>
        <div class="search-row">
            <div class="field">
                <label for="nit">NIT del negocio o Cédula</label>
                <input type="number" id="nit" placeholder="Ej: 900123456" oninput="validarNIT(this)">
            </div>
            <button type="button" class="btn btn-search" onclick="buscarNIT()">Buscar</button>
        </div>
    </div>

    <!-- SELECTOR DE LOCALES (cuando hay múltiples) -->
    <div class="card hidden" id="card-locales">
        <div class="card-title" id="locales-titulo">🏢 Locales encontrados</div>
        <div class="locales-list" id="locales-list"></div>
    </div>

    <!-- DATOS DEL LOCAL SELECCIONADO -->
    <div class="card hidden" id="card-datos">
        <div id="badge-container"></div>
        <div class="card-title">🏪 Datos del Local</div>

        <div class="field">
            <label>Razón Social</label>
            <input type="text" id="nombre_negocio" placeholder="Nombre comercial" required>
        </div>
        <div class="field">
            <label>Dirección</label>
            <input type="text" id="direccion" placeholder="Dirección exacta" required>
        </div>
        <div class="field">
            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="Número de contacto">
        </div>
    </div>

    <!-- ESTADO DE VISITA -->
    <div class="card hidden" id="card-estado">
        <div class="card-title">📋 Estado de la Visita</div>

        <div class="field">
            <label for="estado_visita">Estado</label>
            <select id="estado_visita" onchange="gestionarEstados()" required>
                <option value="">Seleccione un estado...</option>
                <option value="EFECTIVA">✅ Efectiva (Encuesta realizada)</option>
                <option value="NO-EFECTIVA">❌ No Efectiva</option>
            </select>
        </div>

        <!-- Bloque Efectiva -->
        <div id="bloque-efectiva" class="hidden">
            <div class="divider" style="margin: 12px 0;"></div>
            <div class="field">
                <label for="respuesta_ia">¿Qué opción eligió en WhatsApp?</label>
                <select id="respuesta_ia">
                    <option value="">Seleccione la respuesta...</option>
                    <option value="Atención en WhatsApp">A. Atención en WhatsApp</option>
                    <option value="Crear fotos y videos">B. Crear fotos y videos</option>
                    <option value="Organizar finanzas">C. Organizar finanzas</option>
                </select>
            </div>
        </div>

        <!-- Bloque No Efectiva -->
        <div id="bloque-pendiente" class="hidden">
            <div class="divider" style="margin: 12px 0;"></div>
            <div class="field">
                <label for="motivo_pendiente">Motivo de la no efectividad</label>
                <select id="motivo_pendiente">
                    <option value="">Seleccione el motivo...</option>
                    <optgroup label="▬ Negocio Cerrado / Inexistente ▬">
                        <option value="CERRADO PERMANENTE">Cerrado No Existe</option>
                        <option value="CERRADO PERMANENTE">Cerrado Se Trasladó</option>
                        <option value="CERRADO PERMANENTE">Cerrado Por Extorsión</option>
                        <option value="CERRADO PERMANENTE">Otro Negocio en el Lugar</option>
                    </optgroup>
                    <optgroup label="▬ Problemas de Ubicación o Políticas ▬">
                        <option value="DIRECCION ERRADA">Dirección Errada / Incompleta</option>
                        <option value="NO PERMITEN CELULARES">Políticas no permiten celular</option>
                    </optgroup>
                    <optgroup label="▬ Problemas de Atención / Contacto ▬">
                        <option value="OCUPADO">Ocupado (Atendiendo clientes)</option>
                        <option value="EL ENCARGADO NO ESTA">No está el responsable</option>
                        <option value="NO ATENDIERON">Nadie salió a atender</option>
                        <option value="RECHAZO">No le interesa, rechazó la información</option>
                        <option value="REPORTA EXTORSION">No quiso atender, reportó extorsión</option>
                        <option value="CERRADO HORARIO">Cerrado por horario</option>
                        <option value="REPROGRAMADO">Ocupado - reprogramó visita</option>
                    </optgroup>
                </select>
            </div>

            <div class="field">
                <label for="observaciones">📝 Observaciones (Opcional)</label>
                <textarea id="observaciones" rows="3" placeholder="Ej: Me dijeron que pasara después de las 3 PM..."></textarea>
            </div>

            <div class="field">
                <label for="intento">Número de Intento</label>
                <select id="intento">
                    <option value="1">Intento 1</option>
                    <option value="2">Intento 2</option>
                </select>
            </div>
        </div>
    </div>

    <!-- BOTÓN ENVIAR -->
    <button type="button" class="btn btn-primary hidden" id="btn-enviar" onclick="enviarDatos()">
        📤 Enviar Registro
    </button>

</div>

<script>
    function validarNIT(input) {
        input.value = input.value.replace(/[^0-9]/g, '');
    }

    const tg = window.Telegram.WebApp;
    tg.expand();

    let baseDatos = { locales: {}, nit_index: {} };
    let tipoRegistroActual = "";
    let localSeleccionado = null; // matrícula del local activo

    fetch('data.json')
        .then(r => r.json())
        .then(data => baseDatos = data)
        .catch(e => console.error("Error cargando data.json:", e));

    function buscarNIT() {
        const nit = document.getElementById("nit").value.trim();
        if (!nit) { tg.showAlert("Por favor, ingrese un NIT o Cédula."); return; }

        // Resetear estado anterior
        localSeleccionado = null;
        tipoRegistroActual = "";
        ocultarSeccionesDatos();

        const matriculas = baseDatos.nit_index[nit];

        if (!matriculas || matriculas.length === 0) {
            // NIT no encontrado → negocio nuevo
            mostrarLocalNuevo(nit);
        } else if (matriculas.length === 1) {
            // Un solo local → mostrar directamente
            seleccionarLocal(matriculas[0], true);
        } else {
            // Múltiples locales → mostrar lista para elegir
            mostrarListaLocales(matriculas, nit);
        }
    }

    function mostrarListaLocales(matriculas, nit) {
        const card = document.getElementById("card-locales");
        const lista = document.getElementById("locales-list");
        const titulo = document.getElementById("locales-titulo");

        titulo.textContent = `🏢 ${matriculas.length} locales encontrados para NIT ${nit}`;
        lista.innerHTML = "";

        matriculas.forEach(mat => {
            const local = baseDatos.locales[mat];
            if (!local) return;

            const div = document.createElement("div");
            div.className = "local-card";
            div.dataset.matricula = mat;
            div.innerHTML = `
                <div class="local-nombre">${local.nombre_negocio}</div>
                <div class="local-dir">${local.direccion}</div>
                <div class="local-mat">Matrícula: ${mat}</div>
            `;
            div.addEventListener("click", () => {
                // Deseleccionar todos
                document.querySelectorAll(".local-card").forEach(c => c.classList.remove("selected"));
                div.classList.add("selected");
                seleccionarLocal(mat, false);
            });
            lista.appendChild(div);
        });

        card.classList.remove("hidden");
    }

    function seleccionarLocal(matricula, ocultarListaCard) {
        const local = baseDatos.locales[matricula];
        if (!local) return;

        localSeleccionado = matricula;
        tipoRegistroActual = "BASE";

        // Badge
        const badgeContainer = document.getElementById("badge-container");
        badgeContainer.innerHTML = `<span class="badge badge-base">✔ Negocio en Base de Datos</span>`;

        // Rellenar campos
        const nombre = document.getElementById("nombre_negocio");
        const dir = document.getElementById("direccion");
        const tel = document.getElementById("telefono");

        nombre.value = local.nombre_negocio || "";
        dir.value = local.direccion || "";
        tel.value = local.telefono || "";

        nombre.readOnly = true;
        dir.readOnly = true;

        // Mostrar secciones
        document.getElementById("card-datos").classList.remove("hidden");
        document.getElementById("card-estado").classList.remove("hidden");
        document.getElementById("btn-enviar").classList.remove("hidden");

        if (ocultarListaCard) {
            document.getElementById("card-locales").classList.add("hidden");
        }
    }

    function mostrarLocalNuevo() {
        tipoRegistroActual = "NUEVO";
        localSeleccionado = null;

        const badgeContainer = document.getElementById("badge-container");
        badgeContainer.innerHTML = `<span class="badge badge-nuevo">🔵 Negocio Nuevo — Diligencie los datos</span>`;

        const nombre = document.getElementById("nombre_negocio");
        const dir = document.getElementById("direccion");
        const tel = document.getElementById("telefono");

        nombre.value = ""; dir.value = ""; tel.value = "";
        nombre.readOnly = false;
        dir.readOnly = false;

        document.getElementById("card-locales").classList.add("hidden");
        document.getElementById("card-datos").classList.remove("hidden");
        document.getElementById("card-estado").classList.remove("hidden");
        document.getElementById("btn-enviar").classList.remove("hidden");
    }

    function ocultarSeccionesDatos() {
        document.getElementById("card-datos").classList.add("hidden");
        document.getElementById("card-estado").classList.add("hidden");
        document.getElementById("card-locales").classList.add("hidden");
        document.getElementById("btn-enviar").classList.add("hidden");
        document.getElementById("bloque-efectiva").classList.add("hidden");
        document.getElementById("bloque-pendiente").classList.add("hidden");
        document.getElementById("badge-container").innerHTML = "";
        document.getElementById("estado_visita").value = "";
    }

    function gestionarEstados() {
        const estado = document.getElementById("estado_visita").value;
        document.getElementById("bloque-efectiva").classList.add("hidden");
        document.getElementById("bloque-pendiente").classList.add("hidden");
        if (estado === "EFECTIVA") {
            document.getElementById("bloque-efectiva").classList.remove("hidden");
        } else if (estado === "NO-EFECTIVA") {
            document.getElementById("bloque-pendiente").classList.remove("hidden");
        }
    }

    function enviarDatos() {
        const ruta = document.getElementById("ruta").value;
        const nit = document.getElementById("nit").value.trim();
        const estado = document.getElementById("estado_visita").value;

        if (!ruta || !nit || !estado || !tipoRegistroActual) {
            tg.showAlert("Por favor complete la Ruta, el NIT, realice la búsqueda y seleccione un Estado de Visita.");
            return;
        }

        const nombre = document.getElementById("nombre_negocio").value;
        const direccion = document.getElementById("direccion").value;
        const telefono = document.getElementById("telefono").value;

        if (!nombre || !direccion) {
            tg.showAlert("Debe llenar al menos el Nombre del Negocio y la Dirección.");
            return;
        }

        let payload = {
            ruta, nit,
            tipo_registro: tipoRegistroActual,
            nombre_negocio: nombre,
            direccion, telefono,
            estado_visita: estado,
            motivo: "",
            observaciones: document.getElementById("observaciones")?.value.trim() || "",
            intento: "1",
            respuesta_ia: ""
        };

        if (estado === "EFECTIVA") {
            const resp = document.getElementById("respuesta_ia").value;
            if (!resp) { tg.showAlert("Seleccione la respuesta de WhatsApp."); return; }
            payload.respuesta_ia = resp;

        } else if (estado === "NO-EFECTIVA") {
            const selectMotivo = document.getElementById("motivo_pendiente");
            const motivoValue = selectMotivo.value;
            if (!motivoValue) { tg.showAlert("Seleccione el motivo de la no efectividad."); return; }

            const textoMotivo = selectMotivo.options[selectMotivo.selectedIndex].text;
            const obsManual = document.getElementById("observaciones").value.trim();
            payload.motivo = motivoValue;
            payload.observaciones = obsManual ? `${textoMotivo} - ${obsManual}` : textoMotivo;
            payload.intento = document.getElementById("intento").value;
        }

        tg.sendData(JSON.stringify(payload));
    }
</script>
</body>
</html>
