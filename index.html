<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Encuesta Cámara de Comercio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #333);
            margin: 0;
            padding: 15px;
        }
        .container {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-top: 0;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        input[readonly] {
            background-color: #e9ecef;
            color: #495057;
        }
        .btn {
            background-color: #0056b3;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-search {
            background-color: #28a745;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .badge-base { background-color: #d4edda; color: #155724; }
        .badge-nuevo { background-color: #cce5ff; color: #004085; }
        .section-divider {
            border-top: 2px dashed #ccc;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Plataforma de registro para actividad CCB</h2>

    <label for="ruta">📍 Ruta Asignada</label>
    <select id="ruta" required>
        <option value="">Seleccione su ruta...</option>
        <option value="Ruta 1">Ruta 1</option>
        <option value="Ruta 2">Ruta 2</option>
        <option value="Ruta 3">Ruta 3</option>
        <option value="Ruta 4">Ruta 4</option>
        <option value="Ruta 5">Ruta 5</option>
        <option value="Ruta 6">Ruta 6</option>
        <option value="Ruta 7">Ruta 7</option>
        <option value="Ruta 8">Ruta 8</option>
    </select>

    <div class="section-divider"></div>

    <label for="nit">🔍 NIT del negocio o Cédula</label>
    <input type="number" id="nit" placeholder="Ej: 900123456" oninput="validarNIT(this)" required>
    <button type="button" class="btn btn-search" onclick="buscarNIT()">Buscar Local</button>

    <div id="badge-container" class="hidden">
        <span id="badge-tipo" class="badge"></span>
    </div>

    <div id="datos-negocio" class="hidden">
        <label>Razón social</label>
        <input type="text" id="nombre_negocio" placeholder="Nombre comercial" required>

        <label>Dirección </label>
        <input type="text" id="direccion" placeholder="Dirección exacta" required>

        <label>Teléfono</label>
        <input type="tel" id="telefono" placeholder="Número de contacto" required>

    </div>

    <div class="section-divider"></div>

    <label for="estado_visita">📋 Estado de la Visita</label>
    <select id="estado_visita" onchange="gestionarEstados()" required>
        <option value="">Seleccione un estado...</option>
        <option value="EFECTIVA">✅ Efectiva (Encuesta realizada)</option>
        <option value="NO-EFECTIVA">❌ No Efectiva</option>
    </select>

    <div id="bloque-efectiva" class="hidden">
        <label for="respuesta_ia">¿Qué opción eligió en WhatsApp?</label>
        <select id="respuesta_ia">
            <option value="">Seleccione la respuesta...</option>
            <option value="A">A. Responder mensajes / WhatsApp</option>
            <option value="B">B. Crear fotos / publicidad</option>
            <option value="C">C. Organizar cuentas / inventarios</option>
            <option value="D">D. Todavía no la uso (Curiosidad)</option>
        </select>
    </div>

    <div id="bloque-pendiente" class="hidden">
        <label for="motivo_pendiente">¿Motivo de la no efectividad?</label>
        <select id="motivo_pendiente">
            <option value="">Seleccione el motivo...</option>

            <!--<option disabled>▬▬"𝗡𝗲𝗴𝗼𝗰𝗶𝗼 𝗖𝗲𝗿𝗿𝗮𝗱𝗼 / 𝗜𝗻𝗲𝘅𝗶𝘀𝘁𝗲𝗻𝘁𝗲"▬▬</option>-->

            <optgroup label="▬𝗡𝗲𝗴𝗼𝗰𝗶𝗼 𝗖𝗲𝗿𝗿𝗮𝗱𝗼 / 𝗜𝗻𝗲𝘅𝗶𝘀𝘁𝗲𝗻𝘁𝗲▬">
                <option value="CERRADO PERMANENTE">Cerrado No Existe</option>
                <option value="CERRADO PERMANENTE">Cerrado Se Trasladó</option>
                <option value="CERRADO PERMANENTE">Cerrado Por Extorsión</option>
                <option value="CERRADO PERMANENTE">Otro Negocio en el Lugar</option>
            </optgroup>

           <!-- <option disabled>▬▬"𝗣𝗿𝗼𝗯𝗹𝗲𝗺𝗮𝘀 𝗱𝗲 𝗨𝗯𝗶𝗰𝗮𝗰𝗶𝗼́𝗻 𝗼 𝗣𝗼𝗹𝗶́𝘁𝗶𝗰𝗮𝘀"▬▬</option>-->
            <optgroup label="▬𝗣𝗿𝗼𝗯𝗹𝗲𝗺𝗮𝘀 𝗱𝗲 𝗨𝗯𝗶𝗰𝗮𝗰𝗶𝗼́𝗻 𝗼 𝗣𝗼𝗹𝗶́𝘁𝗶𝗰𝗮𝘀▬">
                <option value="DIRECCION ERRADA">Dirección Errada / Incompleta</option>
                <option value="NO PERMITEN CELULARES">Políticas no permiten celular</option>
            </optgroup>

            <!--<option disabled>▬▬"𝗣𝗿𝗼𝗯𝗹𝗲𝗺𝗮𝘀 𝗱𝗲 𝗔𝘁𝗲𝗻𝗰𝗶𝗼́𝗻 / 𝗖𝗼𝗻𝘁𝗮𝗰𝘁𝗼"▬▬</option>-->

            <optgroup label="▬𝗣𝗿𝗼𝗯𝗹𝗲𝗺𝗮𝘀 𝗱𝗲 𝗔𝘁𝗲𝗻𝗰𝗶𝗼́𝗻 / 𝗖𝗼𝗻𝘁𝗮𝗰𝘁𝗼▬">
                <option value="OCUPADO">Ocupado (Atendiendo clientes)</option>
                <option value="EL ENCARGADO NO ESTA">No esta el responsable y el se encarga de todo</option>
                <option value="NO ATENDIERON">Nadie salió a atender</option>
                <option value="RECHAZO">No le interesa, rechazó la información</option>
                <option value="REPORTA EXTORSION">No quiso atender, reporto extorsión</option>
                <option value="CERRADO HORARIO">Cerrado por horario</option>
                <option value="REPROGRAMADO">Ocupado - reprogramó visita</option>
            </optgroup>  
        </select>

        <label for="observaciones">📝 Observaciones (Opcional)</label>
        <textarea id="observaciones" rows="3" placeholder="Ej: Me dijeron que pasara después de las 3 PM..."></textarea>

        <label for="intento">Número de Intento</label>
        <select id="intento">
            <option value="1">Intento 1</option>
            <option value="2">Intento 2</option>
        </select>
    </div>

    <button type="button" class="btn" onclick="enviarDatos()">📤 Enviar Registro</button>
</div>

<script>
    // Función para evitar que escriban letras, puntos, guiones o la letra 'e'
    function validarNIT(input) {
        input.value = input.value.replace(/[^0-9]/g, '');
    }

    const tg = window.Telegram.WebApp;
    tg.expand(); // Expande la Mini App a pantalla completa

    let baseDatos = {};
    let tipoRegistroActual = "";

    // Cargar la base de datos al iniciar
    fetch('data.json')
        .then(response => response.json())
        .then(data => baseDatos = data)
        .catch(error => console.error("Error cargando data.json. Si estás probando localmente, puede fallar por CORS.", error));

    function buscarNIT() {
        const nit = document.getElementById("nit").value.trim();
        if (!nit) {
            tg.showAlert("Por favor, ingrese un NIT o Cédula.");
            return;
        }

        const datos = baseDatos[nit];
        const badgeContainer = document.getElementById("badge-container");
        const badgeTipo = document.getElementById("badge-tipo");
        const divDatos = document.getElementById("datos-negocio");

        divDatos.classList.remove("hidden");
        badgeContainer.classList.remove("hidden");

        if (datos) {
            // Es un negocio registrado
            tipoRegistroActual = "BASE";
            badgeTipo.className = "badge badge-base";
            badgeTipo.innerText = "✔ Negocio en Base de Datos";

            document.getElementById("nombre_negocio").value = datos.nombre_negocio || "";
            document.getElementById("direccion").value = datos.direccion || "";
            document.getElementById("telefono").value = datos.telefono || "";

            // Opcional: Bloquear campos para que no los editen accidentalmente
            document.getElementById("nombre_negocio").readOnly = true;
            document.getElementById("direccion").readOnly = true;
        } else {
            // Es un negocio nuevo
            tipoRegistroActual = "NUEVO";
            badgeTipo.className = "badge badge-nuevo";
            badgeTipo.innerText = "🔵 Negocio Nuevo (Por favor diligencie los datos)";

            // Limpiar y habilitar campos
            document.getElementById("nombre_negocio").value = "";
            document.getElementById("direccion").value = "";
            document.getElementById("telefono").value = "";
            
            document.getElementById("nombre_negocio").readOnly = false;
            document.getElementById("direccion").readOnly = false;
        }
    }

    function gestionarEstados() {
        const estado = document.getElementById("estado_visita").value;
        
        // Ocultar todos primero
        document.getElementById("bloque-efectiva").classList.add("hidden");
        document.getElementById("bloque-pendiente").classList.add("hidden");

        // Mostrar según selección
        if (estado === "EFECTIVA") {
            document.getElementById("bloque-efectiva").classList.remove("hidden");
        } else if (estado === "NO-EFECTIVA") {
            document.getElementById("bloque-pendiente").classList.remove("hidden");
        }
    }

    function enviarDatos() {
        const ruta = document.getElementById("ruta").value;
        const nit = document.getElementById("nit").value.trim();
        const estado = document.getElementById("estado_visita").value;

        // Validaciones básicas
        if (!ruta || !nit || !estado || !tipoRegistroActual) {
            tg.showAlert("Por favor complete la Ruta, el NIT, realice la búsqueda y seleccione un Estado de Visita.");
            return;
        }

        let nombre = document.getElementById("nombre_negocio").value;
        let direccion = document.getElementById("direccion").value;
        let telefono = document.getElementById("telefono").value;

        if(!nombre || !direccion) {
            tg.showAlert("Debe llenar al menos el Nombre del Negocio y la Dirección.");
            return;
        }

        // Construir el objeto a enviar a Python
        let payload = {
            ruta: ruta,
            nit: nit,
            tipo_registro: tipoRegistroActual,
            nombre_negocio: nombre,
            direccion: direccion,
            telefono: telefono,
            estado_visita: estado,
            motivo: "",
            observaciones: document.getElementById("observaciones").value.trim(),
            intento: "1",
            respuesta_ia: ""
        };

        // Extraer datos específicos según el estado
        if (estado === "EFECTIVA") {
            const resp = document.getElementById("respuesta_ia").value;
            if (!resp) { tg.showAlert("Seleccione la respuesta de WhatsApp."); return; }
            payload.respuesta_ia = resp;

        } else if (estado === "NO-EFECTIVA") {
            const motivo = document.getElementById("motivo_pendiente").value;
            const intento = document.getElementById("intento").value;
            if (!motivo) { tg.showAlert("Seleccione el motivo de la no efectividad."); return; }
            payload.motivo = motivo;
            payload.intento = intento;
        }

        // Enviar datos al bot de Telegram y cerrar la app
        tg.sendData(JSON.stringify(payload));
    }
</script>

</body>
</html>
